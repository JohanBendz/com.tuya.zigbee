name: YOLO Automation Pipeline

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  yolo-automation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - name: YOLO Lint
        run: npm run lint
      - name: YOLO Build
        run: npm run build
      - name: YOLO Icon Generation
        run: node scripts/icon-generator.js
      - name: YOLO Sync Drivers
        run: npm run sync-drivers --if-present
      - name: YOLO Test
        run: npm test --if-present
      - name: YOLO Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🚀 YOLO: Automated pipeline execution"
          file_pattern: |
            assets/**
            drivers/**
            scripts/**
            dashboard/**
