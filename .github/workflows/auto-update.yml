name: Full Automation Pipeline

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: node scripts/icon-generator.js
      - name: Validate Homey App (optional)
        run: npx homey app validate || echo "Homey validate failed, continuing..."
      - run: npm test --if-present

  sync-drivers:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: npm install
      - name: Sync drivers
        run: npm run sync-drivers --if-present
      - name: Generate icons
        run: node scripts/icon-generator.js
      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🚀 YOLO: Automated drivers sync & icons generation"
          file_pattern: |
            drivers/**
            assets/icons/**
            assets/icon-*.json

  create-pull-request:
    needs: sync-drivers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create PR
        uses: peter-evans/create-pull-request@v5
        with:
          title: "[YOLO] Automated drivers sync & icons generation"
          branch: yolo/auto-update
          commit-message: "🚀 YOLO: Automated update"
          labels: automation, yolo
