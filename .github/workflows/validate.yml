name: Validate app

on:
  push:
    branches: [SDK3, modernize-2026, develop-0.4, develop-0.4.1]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts

      # app.json is generated output. Always let Homey Compose create it
      # before any repository check is allowed to consume it.
      - name: Generate app.json with Homey Compose
        run: npx --yes homey@4.5.0 app build

      - name: Verify generated app.json is committed
        run: git diff --exit-code -- app.json

      - name: Verify generated supported-device index is committed
        run: npm run check:supported-devices

      - name: Run repository tests against generated manifest
        run: npm test

      - name: Run Homey publish validation
        run: npx --yes homey@4.5.0 app validate --level publish

      - name: Verify validation did not change generated manifest
        run: git diff --exit-code -- app.json

      - name: Whitespace check
        run: git diff --check
